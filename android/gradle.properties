org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep the legacy AGP DSL until plugins finish migrating off it.
android.newDsl=false
# AGP 9+ built-in Kotlin: required so FlutterFire plugins that skip applying
# kotlin-android still compile their Kotlin sources (e.g. FirebaseAppCheckPlugin).
android.builtInKotlin=true
