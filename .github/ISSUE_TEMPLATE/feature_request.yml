name: Feature request
description: Suggest an improvement that fits Quorivell’s local-first product
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please skim [architecture](https://github.com/cherifsahraoui/Quorivell/blob/main/docs/architecture.md)
        before large proposals. Cloud sync / remote AI need an explicit privacy
        design — open an issue first, don’t send a surprise mega-PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is unmet today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Keep privacy / on-device constraints in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy boundary
      options:
        - label: This can stay fully on-device (preferred when possible)
        - label: This would need an explicit remote / consent flow
          required: false
