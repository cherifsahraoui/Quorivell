name: Bug report
description: Something in Quorivell does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not paste real conversation text,
        credentials, or private screenshots.** Use synthetic or redacted samples.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps with synthetic data only.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / commit version
      description: Play build (e.g. 0.x.y+N) or git SHA if building from source.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Device / OS
      description: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Quorivell?
      options:
        - Google Play (closed testing or production)
        - Built from this repository
        - Other
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Logs (redacted), screenshots without private content, etc.
