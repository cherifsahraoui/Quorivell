# SonarQube Cloud analysis (Dart/Flutter).
# Automatic analysis does not support Dart — CI analysis is required.
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      # Public repo omits real FlutterFire output (.publicignore). Stub so
      # firebase_bootstrap / main imports compile for unit tests + coverage.
      - name: Stub Firebase options for public CI
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          // Generated for public CI only — not a real Firebase project.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              throw UnsupportedError(
                'DefaultFirebaseOptions are not configured in the public clone. '
                'Run flutterfire configure against your own project.',
              );
            }
          }
          EOF

      - name: Unit tests with coverage
        run: flutter test --coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
