# SonarQube Cloud — CI analysis (not automatic analysis; Dart is unsupported there).
# Project: https://sonarcloud.io/project/overview?id=cherifsahraoui_Quorivell
sonar.organization=cherifsahraoui
sonar.projectKey=cherifsahraoui_Quorivell
sonar.projectName=Quorivell

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Prefer hand-written product code; generated Freezed / Riverpod / Drift / l10n stay out.
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/app_localizations*.dart,\
  **/firebase_options.dart

sonar.dart.lcov.reportPaths=coverage/lcov.info
