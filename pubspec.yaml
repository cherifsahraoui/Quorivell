name: quorivell
description: Quorivell turns messy conversations into private, traceable decisions and commitments.
publish_to: 'none'
version: 0.6.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  a2ui_core: ^0.1.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_ai: ^4.0.0
  drift: ^2.30.0
  drift_flutter: 0.3.1
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  hooks_riverpod: ^3.4.3
  riverpod: ^3.4.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  http: ^1.6.0
  shared_preferences: ^2.5.3
  llama_cpp_dart: 0.2.2
  typed_isolate: ^6.0.0
  ffi: ^2.1.4
  path_provider: ^2.1.5
  crypto: ^3.0.6
  genui: ^0.10.2
  logging: ^1.3.0
  uuid: ^4.5.1
  firebase_app_check: ^0.4.7
  google_fonts: ^8.2.1
  auto_size_text: ^3.0.0
  file_picker: ^13.1.0
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.30.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon.svg
    - assets/title.png
    - assets/title_dark.png
    - assets/onboard_capture.png
    - assets/onboard_capture_dark.png
    - assets/onboard_extract.png
    - assets/onboard_privacy.png
    - assets/onboard_chat.png

# Generate launcher icons with following command:
# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
